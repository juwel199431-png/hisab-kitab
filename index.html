    <script>
      // Mock vite-hmr / vite-ping WebSocket in Cloud Run iframe preview environment
      if (typeof window !== 'undefined' && window.WebSocket) {
        const RealWS = window.WebSocket;
        const SafeWS = function (url, protocols) {
          if (
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (typeof url === 'string' && (url.includes('token=') || url.includes('vite')))
          ) {
            return {
              readyState: 1, // WebSocket.OPEN
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              url: String(url),
              protocol: protocols || '',
              send: function () {},
              close: function () {},
              addEventListener: function (event, handler) {
                if (event === 'open') {
                  setTimeout(() => {
                    try { handler({ type: 'open' }); } catch (_) {}
                  }, 0);
                }
              },
              removeEventListener: function () {},
              dispatchEvent: function () { return true; },
            };
          }
          return new RealWS(url, protocols);
        };
        SafeWS.prototype = RealWS.prototype;
        SafeWS.OPEN = RealWS.OPEN;
        SafeWS.CLOSED = RealWS.CLOSED;
        SafeWS.CLOSING = RealWS.CLOSING;
        SafeWS.CONNECTING = RealWS.CONNECTING;
        window.WebSocket = SafeWS;

        // Suppress [vite] benign HMR WebSocket logging from triggering AI Studio error monitor
        const origConsoleError = console.error;
        console.error = function (...args) {
          if (
            args[0] &&
            typeof args[0] === 'string' &&
            (args[0].includes('[vite]') || args[0].includes('WebSocket closed without opened'))
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function (e) {
          const reason = e.reason;
          const msg = typeof reason === 'string' ? reason : reason?.message || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.preventDefault();
          }
        });

        window.addEventListener('error', function (e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
            e.preventDefault();
          }
        });
      }
    </script>
